name: Hearts across exchange - exploration only
on:
  push:
    branches: [codex/hearts-across-fixed-exploration-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  across-exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/hearts-across-exploration.cjs verify
      - run: npm test
      - run: node scripts/hearts-across-exploration.cjs run across-exchange
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hearts-next-exploration-v1-across-exchange
          path: exploration/
          retention-days: 30
          if-no-files-found: error
